name: Build APK
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish the APK as a GitHub release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Tools for host tests
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm zlib1g-dev
      - name: Host tests (core, instructions, differential, system mode, loaders, JNI)
        run: |
          export LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          tests/run_all.sh
      - name: Build APK
        run: gradle assembleDebug
      - name: Name the APK
        id: ver
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/*.apk "MacNuron-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: macnuron-apk-${{ steps.ver.outputs.name }}
          path: MacNuron-${{ steps.ver.outputs.name }}.apk
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" "MacNuron-$V.apk" --target "$GITHUB_SHA" --prerelease \
            --title "MacNuron $V" \
            --notes "Автоматическая сборка коммита ${GITHUB_SHA::7}. Экспериментальный эмулятор MacNuron (macOS 11 Big Sur ARM64 kernelcache loader)."
